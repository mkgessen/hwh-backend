name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirm publishing to PyPI (yes/no)'
        required: true
        default: 'no'
        type: string

jobs:
  test:
    if: github.event.inputs.confirm_release == 'yes'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Check for release tag
      run: |
        if [[ -z "${{ github.ref_name }}" || ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "Error: This workflow must be run on a release tag (e.g., v1.0.0)"
          exit 1
        fi

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra test

    - name: Run tests
      run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      run: uv publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
